<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন বাবা! ❤️</title>
    <!-- বাংলা ফ্রন্ট যুক্ত করা হয়েছে -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড অ্যানিমেশনের ক্যানভাস */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* মেইন কার্ড ডিজাইন */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 520px;
            width: 90%;
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .icon {
            font-size: 65px;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulseCake 1.5s infinite alternate;
        }

        @keyframes pulseCake {
            0% { transform: scale(1); }
            100% { transform: scale(1.15) rotate(5deg); }
        }

        h1 {
            font-size: 2.5rem;
            color: #ffde59;
            text-shadow: 0 0 15px rgba(255, 222, 89, 0.6);
            margin-bottom: 10px;
        }

        .love-text {
            font-size: 1.8rem;
            color: #ff66c4;
            font-weight: 700;
            margin-bottom: 18px;
            text-shadow: 0 0 10px rgba(255, 102, 196, 0.5);
        }

        p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #e2e8f0;
            margin-bottom: 25px;
        }

        /* সুন্দর বাটন */
        .btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.7);
        }

        /* লুকানো চমক বার্তা */
        .surprise-msg {
            margin-top: 20px;
            font-size: 1.4rem;
            color: #00f2fe;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.8s ease forwards;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- অ্যানিমেশন ক্যানভাস -->
    <canvas id="confettiCanvas"></canvas>

    <!-- কার্ড কনটেন্ট -->
    <div class="card">
        <div class="icon">🎂</div>
        <h1>শুভ জন্মদিন বাবা! ❤️</h1>
        <div class="love-text">✨ Love You Baba! ✨</div>
        <p>
            আমার জীবনের প্রতিটি পদক্ষেপে তোমার ভালোবাসা, দিকনির্দেশনা ও ত্যাগ আমাকে আজকের আমি করে তুলেছে। তুমি আমার সত্যিকারের সুপারহিরো! ঈশ্বর তোমাকে সর্বদা সুস্থ ও দীর্ঘায়ু রাখুন।
        </p>
        <button class="btn" onclick="showSurprise()">এখানে চাপ দিন বাবা 🎁</button>
        <div class="surprise-msg" id="surprise">
            💖 "তুমি পৃথিবীর সেরা বাবা!" 💖
        </div>
    </div>

    <!--JavaScript অংশ-->
    <script>
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // পার্টিকেল (Hearts and Confetti) তৈরি
        const particles = [];
        const colors = ['#ff007f', '#ff66c4', '#ffde59', '#00f2fe', '#ffffff', '#7928ca'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 8 + 4;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * -2 - 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.shape = Math.random() > 0.5 ? 'circle' : 'heart';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // উপর দিয়ে বের হয়ে গেলে নিচ থেকে আবার চালু হবে
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();

                if (this.shape === 'circle') {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // হার্ট (Heart) শেপ আঁকার লজিক
                    ctx.font = `${this.size * 2}px serif`;
                    ctx.fillText('❤️', this.x, this.y);
                }
            }
        }

        function init() {
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();

        // বাটনে ক্লিক করলে সারপ্রাইজ মেসেজ দেখানো ও অতিরিক্ত অ্যানিমেশন
        function showSurprise() {
            const msg = document.getElementById('surprise');
            msg.style.display = 'block';

            // ক্লিক করলে প্রচুর নতুন পার্টিকেল যুক্ত হবে (Fireworks effect)
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle());
            }
        }
    </script>
</body>
</html>
